[package]
name = "comms"
version = "5.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
unicode-normalization = "0.1.26"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
